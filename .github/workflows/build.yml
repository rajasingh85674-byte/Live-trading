name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_API: "33"
  ANDROID_BUILD_TOOLS: "33.0.2"
  ANDROID_NDK_VERSION: "25.1.8937393"
  CMDLINE_TOOLS_ZIP: "commandlinetools-linux-11076708_latest.zip"
  BUILDOZER_WARN_ON_ROOT: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages and compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran autoconf automake libtool libtool-bin autopoint gettext \
            libblas-dev liblapack-dev cython3 \
            git zip unzip curl pkg-config cmake ccache \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev libreadline-dev liblzma-dev uuid-dev \
            libdb-dev libgdbm-dev tk-dev

      - name: Install Android SDK, build-tools and NDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/${CMDLINE_TOOLS_ZIP}"
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          # legacy path that python-for-android / buildozer still look for
          mkdir -p "$ANDROID_HOME/tools/bin"
          printf '#!/bin/sh\nexec "%s/cmdline-tools/latest/bin/sdkmanager" "$@"\n' "$ANDROID_HOME" > "$ANDROID_HOME/tools/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          set -o pipefail
          "$SDKM" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          test -x "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Make /usr/local writable (python-for-android installs its own Python there)
        run: |
          sudo mkdir -p /usr/local/bin /usr/local/lib /usr/local/include /usr/local/share
          sudo chown -R "$(id -u):$(id -g)" /usr/local/bin /usr/local/lib /usr/local/include /usr/local/share
          sudo chmod -R a+rwX /usr/local/bin /usr/local/lib /usr/local/include /usr/local/share

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<70" virtualenv
          which python cython buildozer
          cython --version

      - name: Point buildozer.spec at the SDK and NDK
        run: |
          sed -i "s|^android.sdk_path =.*|android.sdk_path = ${ANDROID_HOME}|" buildozer.spec
          sed -i "s|^android.ndk_path =.*|android.ndk_path = ${ANDROID_NDK_HOME}|" buildozer.spec
          grep -nE "^(android\.(api|minapi|ndk|ndk_api|sdk_path|ndk_path|archs)|p4a\.branch|requirements)" buildozer.spec

      - name: Build debug APK (as root, so no permission errors)
        shell: bash   # bash with "-e -o pipefail": a failed Buildozer now fails this step, even through "| tee"
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" "ANDROID_HOME=$ANDROID_HOME" \
            "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" \
            "BUILDOZER_WARN_ON_ROOT=0" \
            buildozer -v android debug 2>&1 | tee build.log
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true

      - name: Show the important part of the build log
        if: failure()
        shell: bash
        run: |
          echo "=== lines with errors ==="
          grep -nEi "error|failed|traceback|not found|permission denied" build.log | tail -n 60 || true
          echo "=== last 150 lines ==="
          tail -n 150 build.log || true

      - name: Collect the APK into bin/
        shell: bash
        run: |
          mkdir -p bin
          if ! ls bin/*.apk > /dev/null 2>&1; then
            echo "No APK in bin/, searching the whole workspace..."
            find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/node_modules/*" -exec cp -v {} bin/ \;
          fi
          ls -la bin
          if ! ls bin/*.apk > /dev/null 2>&1; then
            echo "Buildozer finished but produced no APK."
            tail -n 150 build.log || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tactical-neural-matrix-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
